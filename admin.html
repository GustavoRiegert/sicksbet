<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07070a">
  <meta name="robots" content="noindex">
  <title>SicksBET — Admin</title>
  <link rel="icon" type="image/webp" href="assets/logo.webp">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-admin">
  <header class="topbar">
    <div class="topbar__in">
      <a class="brand" href="./" aria-label="Voltar ao site">
        <img src="assets/logo.webp" alt="" width="40" height="40">
        <span>Sicks<b>BET</b></span>
      </a>
      <span class="adminTag">⚙️ Admin</span>
      <a class="btn btn--ghost btn--sm" href="./">← Voltar ao site</a>

  <main id="app" class="wrap"></main>

  <div class="modal" id="modal" hidden>
    <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="core.js"></script>
  <script src="admin.js"></script>

</html>
