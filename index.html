<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07070a">
  <title>SicksBET — O John Sick vem hoje?</title>
  <meta name="description" content="A casa de apostas mais confiável do escritório. Só pontos, zero dinheiro.">
  <link rel="icon" type="image/webp" href="assets/logo.webp">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__in">
      <a class="brand" href="./" aria-label="SicksBET">
        <img src="assets/logo.webp" alt="" width="40" height="40">
        <span>Sicks<b>BET</b></span>
      </a>
      <nav class="nav" id="nav" aria-label="Navegação principal">
        <button data-tab="apostar" class="is-active"><span class="ico">⚽</span><span>Apostar</span></button>
        <button data-tab="ranking"><span class="ico">🏆</span><span>Ranking</span></button>
        <button data-tab="historico"><span class="ico">🎫</span><span>Meus palpites</span></button>
        <a href="admin.html"><span class="ico">⚙️</span><span>Admin</span></a>
      </nav>
      <button class="wallet" id="wallet" type="button" aria-label="Seu perfil e pontos" hidden>
        <span class="wallet__name" id="walletName"></span>
        <span class="wallet__pts"><i>◎</i> <b id="walletPts">0</b></span>
      </button>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <footer class="foot">
    <p>🔞 Brincadeira entre amigos. Só pontos, nenhum dinheiro de verdade. Aposte com responsabilidade (e chegue no horário).</p>
  </footer>

  <div class="modal" id="modal" hidden>
    <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
